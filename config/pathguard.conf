# PathGuard agent configuration. Changes apply on `pathguardctl reload`
# (or SIGHUP) except watch_path, mark_type, log_file and control_socket,
# which need a restart.

# ---- policy -------------------------------------------------------------
# enforce: deny matching executions.  audit: allow but record "would deny".
mode = enforce
# Verdict when a scan cannot complete (timeout, read error, worker crash,
# file too large, file changed during scan). Never treated as "clean".
on_error = allow
# Verdict when the scan queue is full.
on_overflow = allow

# ---- scope --------------------------------------------------------------
# Use a dedicated filesystem so the protected scope is explicit.
# The whole filesystem (filesystem mark) or mount (mount mark) is covered,
# including all subdirectories.
watch_path = /mnt/pg-test
mark_type = filesystem
allow_non_mountpoint = false
allow_root_filesystem = false

# ---- scanning -----------------------------------------------------------
workers = 2
queue_max = 256
# Deadline for each execution request, measured from the kernel event.
scan_timeout_ms = 2000
max_file_size = 64M
worker_memory_limit = 512M
worker_user = pathguard
cache_max = 4096

# ---- detection content --------------------------------------------------
blocklist = /etc/pathguard/blocklist.sha256
allowlist = /etc/pathguard/allowlist.sha256
yara_rules = /etc/pathguard/rules

# ---- records ------------------------------------------------------------
log_file = /var/log/pathguard/audit.jsonl
log_max_bytes = 10M
log_keep = 5
quarantine = true
quarantine_dir = /var/lib/pathguard/quarantine
state_file = /var/lib/pathguard/state

# ---- management ---------------------------------------------------------
control_socket = /run/pathguard/control.sock
# Members may run read-only commands; reload/restore require root.
admin_group = pathguard-admin
